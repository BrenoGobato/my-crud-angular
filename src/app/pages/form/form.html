<h1>{{ isEditMode ? 'Editar item' : 'Adicionar novo item' }}</h1>

<form [formGroup]="itemForm">

  <input
    type="text"
    formControlName="item_name"
    placeholder="Digite o nome do item">

  <button type="button" (click)="save()">
    {{ isEditMode ? 'Atualizar item' : 'Salvar novo item' }}
  </button>

</form>
